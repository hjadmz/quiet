<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}"{% if site.theme_default == 'light' or site.theme_default == 'dark' %} data-theme="{{ site.theme_default }}"{% endif %}>
<head>
  {%- include head.html -%}
</head>
<body class="font-{{ site.body_font | default: 'sans' }}">
  <a class="skip-link" href="#main">skip to content</a>
  {%- include nav.html %}
  <main id="main">
    {{ content }}
  </main>
  {%- include footer.html %}
  {%- if content contains 'class="highlight"' %}
  <script src="{{ '/assets/js/copy.js' | relative_url }}" defer></script>
  {%- endif %}
</body>
</html>
