name: Quality

# This workflow tests source and generated output. It never uploads a Pages
# artifact and never deploys the site; GitHub Pages must use the branch source
# documented in README.md.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BUNDLE_FROZEN: "true"
  JEKYLL_ENV: production
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # Only the mother template is supposed to contain its shipped placeholders.
  # A generated repository inherits this workflow under a different name and
  # is held to the same clean-config rule as `npm run verify` locally.
  QUIET_EXPECT_PLACEHOLDER: ${{ github.repository == 'hjadmz/quiet' && '1' || '0' }}

jobs:
  build:
    name: Builds and generated-site checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: npm ci --ignore-scripts

      # The default GitHub Pages build, a customized fork with the demo content and
      # the host overlay removed, and every shape of address a fork can be served
      # from: a github.io user site, a github.io project subfolder, a custom domain,
      # and a custom domain subfolder.
      - run: npm run verify
      - run: npm run test:portable
      - run: npm run test:origins

      # Size only breaks at size. Five hundred posts is where a quadratic archive,
      # an uncapped home page or an unbounded feed would show up, and where the
      # claim that find-in-page replaces a search box is either true or isn't.
      - run: npm run test:scale

      # The only build that emits _headers, so the only thing exercising the
      # response-header contract. Nothing ran it once, and the whole contract could
      # have broken with CI still green.
      #
      # Gated on the file, not on the repository name. It used to be gated on the
      # name because the overlay carried a personal origin, which meant a fork either
      # tested someone else's domain or failed on a file it had been told to delete.
      # The overlay now names a reserved example and nobody, so a fork that keeps it
      # gets the same header check, and a fork that deletes it drops the job with it
      # instead of failing on it.
      - run: npm run verify:cloudflare
        if: hashFiles('_config.cloudflare.yml') != ''

  # This suite passes or fails depending on the machine, not only on the code: file
  # name case matters on Linux and not on macOS, `bundle` is a batch file on Windows,
  # and Ruby's default encoding follows the locale. The template promises to work
  # everywhere, so its own checks are held to the same standard.
  hosts:
    name: Test suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: npm ci --ignore-scripts
      - run: npm run verify

  compatibility:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:compat
        env:
          COMPAT_BROWSER: ${{ matrix.browser }}
