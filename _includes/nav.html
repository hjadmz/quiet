<header class="site-header">
  <nav aria-label="site">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <div class="site-links">
      <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>archive</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>about</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-live="polite">theme: <span id="theme-label">system</span></button>
    </div>
  </nav>
</header>
